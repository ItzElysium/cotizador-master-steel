name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Azurite se lanza con --skipApiVersionCheck: los SDK de Azure suelen usar una versión de API
      # más nueva que la que reconoce el emulador, y sin esa opción responde 400.
      - name: Azurite (emulador de Azure Storage)
        run: |
          docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pruebas (incluye integración con Azurite)
        env:
          AZURITE: "1"
        run: python -m pytest -q
